location: norwayeast
name: mlops-itu-jtk
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: __ENV_ID__
  configuration:
    ingress:
      external: true
      targetPort: 5001
  template:
    containers:
      - name: model-serve
        image: ghcr.io/__OWNER__/model-serve:__TAG__
        resources:
          cpu: 1.0
          memory: 2Gi
        probes:
          - type: Startup
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          - type: Liveness
            httpGet:
              path: /health
              port: 5001
            periodSeconds: 10
            timeoutSeconds: 10
    scale:
      minReplicas: 0
      maxReplicas: 1
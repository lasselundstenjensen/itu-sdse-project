name: mlops-itu-jtk
region: fra1

# Both components deploy pre-built images from the GitHub Container Registry
# (ghcr.io). The GitHub Actions workflow builds and pushes them; App Platform
# never builds from the repository, so the model and MLflow state never enter
# git. GHCR public packages are free; App Platform pulls them without
# credentials, so the packages must be made public once after the first push
# (package settings -> Change visibility). Note that public means the model
# and the MLflow history are publicly downloadable.
#
# __OWNER__ and __TAG__ are rendered by the workflow (lowercased owner and
# the deploying commit SHA; scripts/deploy_do_app.sh renders them to
# literals for manual use).
# Top-level ingress rules instead of per-service routes: routes strip the
# matched path prefix before forwarding, so /invocations reached the scoring
# server as "/" and 404'd. preserve_path_prefix forwards the original path.
ingress:
  rules:
    - component:
        name: model-serve
        preserve_path_prefix: true
      match:
        path:
          prefix: /invocations
    - component:
        name: mlflow-tracking
      match:
        path:
          prefix: /

services:
  - name: mlflow-tracking
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: __OWNER__/mlflow-tracking
      tag: __TAG__
    # 1 GiB: the MLflow server OOMs at 512 MiB while building its FastAPI
    # app (verified by running the deployed image capped at 512m locally).
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    http_port: 5000
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 10
    envs:
      # The MLflow 3.x job-execution/scheduler machinery wedges the server
      # on App Platform after startup (readiness probe times out; verified
      # the server only becomes responsive with it disabled). We don't use
      # scheduled jobs - only tracking and artifact serving.
      - key: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
        value: "false"

  - name: model-serve
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: __OWNER__/model-serve
      tag: __TAG__
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    http_port: 5001
    health_check:
      http_path: /health
      initial_delay_seconds: 90
      period_seconds: 10
      timeout_seconds: 10

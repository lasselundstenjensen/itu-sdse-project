name: GitHub Actions
run-name: ${{ github.actor }} is testing out the train pipeline 🚀
on: [push]
jobs:

  train-pipeline:
    name: Train Model
    runs-on: ubuntu-latest

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v5
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 
          cache: false
      - run: echo "✅ Go has been set up with version ${{ matrix.go-version }}."

      - name: Train Model
        uses: dagger/dagger-for-github@v6
        with:
          verb: run
          args: go run pipeline.go
          version:
        
      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: all-artifacts
          path: artifacts/
  
  
  test-pipeline:
    name: Test Model
    runs-on: ubuntu-latest

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."    
      - name: Run Model Inference Test Action
        uses: lasselundstenjensen/itu-sdse-project-model-validator@main

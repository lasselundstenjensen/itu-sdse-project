# This file contains relevant hyperparameters and image specs for the model

training:
  num_epochs: 5
  batch_size: 32
  learning_rate: 0.0003
  threshold: 0.5
  early_stop_patience: 2
  scheduler_patience: 3
  random_state: 42

image_specs:
  image_size: [64, 64]
  original_image_size: [1600, 768]
  num_classes: 2
  transform_mean: [0.485, 0.456, 0.406]
  transform_std: [0.229, 0.224, 0.225]

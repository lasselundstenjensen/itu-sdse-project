name: CI


on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches:  
      - "main" 
  pull_request:
    branches: 
      - "main" 
  workflow_dispatch: #will also run after running actions

permissions:
  contents: read


jobs:
  # This workflow contains a single job called "test"
  test:
    name: Go tests + lint + Python tests
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: Go unit tests
        run: cd go && go test ./... -v

      - name: Lint + Python tests (Dagger)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          workdir: dagger
          verb: run
          args: go run . test
          version: "0.21.11" 


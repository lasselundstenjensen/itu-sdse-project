name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Run tests with Dagger
    # Pinned instead of ubuntu-latest: the course's Dagger v0.19.6 engine
    # needs a runner image it supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: dagger call test
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.19.6"
          verb: call
          args: test

      - name: Show Dagger engine logs
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 100 dagger-engine-v0.19.6 || true

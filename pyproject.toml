[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vial_classifier"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "polish-gang" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "boto3",
    "dvc",
    "fastapi",
    "loguru",
    "mlflow>=2.18",
    "numpy",
    "pandas",
    "pillow",
    "pip",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
    "typer",
    "uvicorn",
]
requires-python = "~=3.13.0"

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-m 'not model'"
markers = ["model: tests that need a trained model artifact"]

[tool.ruff]
line-length = 99
src = ["vial_classifier"]
include = ["pyproject.toml", "vial_classifier/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["vial_classifier"]
force-sort-within-sections = true


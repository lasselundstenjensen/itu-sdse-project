[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vial_classifier"
version = "0.0.1"
description = "MLOps pipeline for glass vial classification"
authors = [
  { name = "Anops" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["vial_classifier"]
include = ["pyproject.toml", "vial_classifier/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["vial_classifier"]
force-sort-within-sections = true


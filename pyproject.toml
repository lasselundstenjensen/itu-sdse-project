[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vial_classifier"
version = "0.0.1"
description = "Image classifier for pharmaceutical vials (clean vs. defective), ITU Data Science in Production project"
authors = [
  { name = "ITU: MLOPs people" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "boto3>=1.44.0",
    "dvc>=3.67.1",
    "mlflow>=2.18",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pip",
    "python-dotenv",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["vial_classifier"]
include = ["pyproject.toml", "vial_classifier/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["vial_classifier"]
force-sort-within-sections = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
